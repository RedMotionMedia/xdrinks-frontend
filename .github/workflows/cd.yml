name: Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  MAPBOX_KEY: ${{ secrets.MAPBOX_KEY }}           # Add here environment variables first and then when reference it when you build the docker image

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lower-repo
        name: Repository to lowercase
        run: |
          echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

      - name: Set version number
        id: set-version
        run: |
          echo "VERSION=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build & push docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64  # Specify the platforms you need
          tags: |
            ghcr.io/${{ steps.lower-repo.outputs.repository }}:latest,
            ghcr.io/${{ steps.lower-repo.outputs.repository }}:${{ env.VERSION }}
          file: Dockerfile  # Adjust if your Dockerfile is not in the root directory
          build-args: |
            MAPBOX_KEY=${{ env.MAPBOX_KEY }}
          #Add here your environment Variables which you implemented above

      - name: Update Kubernetes manifest
        run: |
          sed -i 's|image: ghcr.io/${{ steps.lower-repo.outputs.repository }}:.*|image: ghcr.io/${{ steps.lower-repo.outputs.repository }}:${{ env.VERSION }}|' deployment/xdrinks-deployment.yaml

      - name: Commit and push changes
        run: |
          git config --local user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.name "${{ github.repository_owner }}"
          git add deployment/xdrinks-deployment.yaml
          git commit -m "Update image tag to version ${{ env.VERSION }}"
          git push --force origin HEAD:kubernetes