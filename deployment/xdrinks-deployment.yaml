apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xdrinks
  name: xdrinks
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xdrinks
  template:
    metadata:
      labels:
        app: xdrinks
    spec:
      containers:
        - image: ghcr.io/redmotionmedia/xdrinks-frontend:33
          name: xdrinks
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_TITLE
              value: "Runs on Kind"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: xdrinks
  namespace: default
spec:
  type: NodePort
  selector:
    app: xdrinks
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xdrinks
  labels:
    app: routing-types
    type: host-based
spec:
  ingressClassName: nginx
  rules:
    - host: "xdrinks.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xdrinks
                port:
                  number: 80
